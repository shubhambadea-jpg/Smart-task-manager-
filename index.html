<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow – Smart Task Manager</title>
    <meta name="description" content="Modern productivity application designed to help students and professionals organize tasks, manage deadlines, track progress, and improve daily productivity." />
    <meta property="og:title" content="TaskFlow – Smart Task Manager" />
    <meta property="og:description" content="Modern productivity application designed to help students and professionals organize tasks, manage deadlines, track progress, and improve daily productivity." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('taskflow_theme');
          if (!saved) {
            var raw = localStorage.getItem('taskflow_settings');
            if (raw) {
              var s = JSON.parse(raw);
              if (s && s.theme) saved = s.theme;
            }
          }
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500/20 selection:text-indigo-900 dark:bg-slate-950 dark:text-slate-100 dark:selection:bg-indigo-500/30 dark:selection:text-indigo-200">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
